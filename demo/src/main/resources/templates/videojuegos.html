<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameStack | Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">GameStack</a>
        </div>
    </nav>

    <main class="container py-5">
        <header class="mb-5">
            <p class="eyebrow mb-2">Biblioteca personal</p>
            <h1 class="display-5 fw-bold">Tus videojuegos favoritos</h1>
            <p class="lead text-secondary">Explora la coleccion inicial de GameStack.</p>
        </header>

        <section class="row g-4" aria-label="Lista de videojuegos">
            <article class="col-md-6 col-xl-4" th:each="videojuego : ${videojuegos}">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <span class="badge text-bg-warning mb-3" th:text="${videojuego.genero}">Genero</span>
                        <h2 class="h4 card-title" th:text="${videojuego.titulo}">Titulo</h2>
                        <p class="card-text text-secondary mb-0">
                            Lanzamiento: <span th:text="${videojuego.anio}">2024</span>
                        </p>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
