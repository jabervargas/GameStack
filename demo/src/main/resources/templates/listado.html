<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>GameStack</title>

    <style>
        .card-game {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            height: 380px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-game img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card-game:hover img {
            transform: scale(1.1);
        }

        .card-overlay {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            transition: opacity 0.4s ease;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            text-align: center;
        }

        .card-game:hover .card-overlay {
            opacity: 1;
        }
    </style>
</head>

<body>
    <!-- BARRA DE NAVEGACIÓN CON FORMULARIO DE BÚSQUEDA A LA BD -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">GameStack</a>

            <form class="d-flex ms-auto" action="/" method="get">
                <input class="form-control me-2" type="search" name="buscar" placeholder="Buscar juego..."
                    th:value="${palabraBuscada}">
                <button class="btn btn-outline-light" type="submit">Buscar</button>
            </form>
        </div>
    </nav>

    <div class="container my-4">

        <!-- AVISO SI NO SE ENCUENTRAN JUEGOS EN LA BASE DE DATOS -->
        <div th:if="${#lists.isEmpty(videojuegos)}" class="alert alert-warning text-center my-5 shadow-sm" role="alert">
            <h4 class="alert-heading fw-bold">¡Juego no disponible!</h4>
            <p class="mb-0">El juego que buscas no se encuentra en nuestra base de datos.</p>
            <hr>
            <a href="/" class="btn btn-warning btn-sm fw-bold">Ver todos los juegos</a>
        </div>

        <!-- MUESTRA LAS TARJETAS SI SE ENCONTRARON RESULTADOS -->
        <div class="row g-4" th:if="${!#lists.isEmpty(videojuegos)}">
            <div class="col-12 col-sm-6 col-md-3" th:each="juego : ${videojuegos}">
                <div class="card-game">
                    <img th:src="${juego.urlImagen}" th:alt="${juego.titulo}">
                    <div class="card-overlay">
                        <h5 class="fw-bold mb-2" th:text="${juego.titulo}"></h5>
                        <p class="small text-light mb-3" th:text="${juego.descripcion}"></p>
                        <a href="#" class="btn btn-primary btn-sm">Ver detalles</a>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
